name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client/personal-finance-app

    env:
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      AUTH_URL: ${{ secrets.AUTH_URL }}
      AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
      AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL_POOLED }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      SETU_ENV: ${{ secrets.SETU_ENV }}
      SETU_BASE_URL: ${{ secrets.SETU_BASE_URL }}
      SETU_AUTH_URL: ${{ secrets.SETU_AUTH_URL }}
      SETU_CLIENT_ID: ${{ secrets.SETU_CLIENT_ID }}
      SETU_CLIENT_SECRET: ${{ secrets.SETU_CLIENT_SECRET }}
      SETU_PRODUCT_INSTANCE_ID: ${{ secrets.SETU_PRODUCT_INSTANCE_ID }}
      SETU_CONNECT_REDIRECT_URL: ${{ secrets.SETU_CONNECT_REDIRECT_URL }}
      SETU_WEBHOOK_URL: ${{ secrets.SETU_WEBHOOK_URL }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/personal-finance-app/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js app
        run: npm run build

      # Create one portable production package.
      # This happens on the GitHub runner, NOT on EC2.
      - name: Package standalone release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          rm -rf release

          # Next.js standalone does not include these automatically.
          # Put them inside the standalone runtime directory.
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static

          mkdir -p release

          # Archive the CONTENTS of standalone, not the standalone directory itself.
          tar -C .next/standalone \
            -czf release/personal-finance-app.tar.gz \
            .

          echo "=== Release size ==="
          du -h release/personal-finance-app.tar.gz

          echo "=== Release contents ==="
          tar -tzf release/personal-finance-app.tar.gz | head -50

      - name: Upload production artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: personal-finance-app-release
          path: client/personal-finance-app/release/personal-finance-app.tar.gz
          retention-days: 1

  deploy:
    name: Deploy to AWS EC2
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Download production artifact
        uses: actions/download-artifact@v5
        with:
          name: personal-finance-app-release
          path: release

      - name: Show downloaded artifact
        run: |
          ls -lh release
          file release/personal-finance-app.tar.gz

      - name: Prepare release directory on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 5m
          script: |
            set -e
            rm -rf /tmp/pfa-release
            mkdir -p /tmp/pfa-release
            chmod 755 /tmp/pfa-release
            echo "Prepared /tmp/pfa-release"

      - name: Copy release to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 15m
          source: "release/*"
          target: "/tmp/pfa-release"
          overwrite: true

      - name: Install release and restart application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 15m

          script: |
            set -e

            export NVM_DIR="$HOME/.nvm"

            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi

            if command -v nvm >/dev/null 2>&1; then
              nvm use 20 >/dev/null 2>&1 || nvm install 20
              nvm use 20
            fi

            echo "=== Runtime versions ==="
            node -v
            npm -v
            pm2 -v || true

            APP_DIR="${{ secrets.EC2_APP_DIR }}"
            APP_DIR="${APP_DIR:-/project/Personal-Finance-App}"

            APP_PATH="$APP_DIR/client/personal-finance-app"
            RELEASE_DIR="/tmp/pfa-release"

            echo "=== Disk before deployment ==="
            df -h /

            echo "=== Memory before deployment ==="
            free -h

            # ---------------------------------------------------------------
            # Find the artifact regardless of the directory structure created
            # by appleboy/scp-action.
            # ---------------------------------------------------------------

            echo "=== Files received from GitHub ==="

            find "$RELEASE_DIR" \
              -maxdepth 5 \
              -type f \
              -print \
              -exec ls -lh {} \; 2>/dev/null || true

            RELEASE_FILE="$(find "$RELEASE_DIR" \
              -maxdepth 5 \
              -type f \
              -name 'personal-finance-app.tar.gz' \
              -print \
              -quit)"

            if [ -z "$RELEASE_FILE" ]; then
              echo "ERROR: personal-finance-app.tar.gz was not found."
              exit 1
            fi

            echo "=== Release artifact found ==="
            echo "$RELEASE_FILE"
            ls -lh "$RELEASE_FILE"

            # ---------------------------------------------------------------
            # Verify production .env exists.
            # ---------------------------------------------------------------

            if [ ! -f "$APP_PATH/.env" ]; then
              echo "ERROR: Production .env does not exist:"
              echo "$APP_PATH/.env"
              exit 1
            fi

            # ---------------------------------------------------------------
            # Prepare staging directory.
            # ---------------------------------------------------------------

            sudo mkdir -p "$APP_PATH"
            sudo chown "$(whoami)":"$(whoami)" "$APP_PATH"

            STAGING_DIR="$APP_PATH/.release-staging"

            rm -rf "$STAGING_DIR"
            mkdir -p "$STAGING_DIR"

            echo "=== Extracting standalone release ==="

            tar -xzf "$RELEASE_FILE" \
              -C "$STAGING_DIR"

            echo "=== Extracted structure ==="
            find "$STAGING_DIR" -maxdepth 3 -type f | head -100

            # Validate the standalone runtime.
            if [ ! -f "$STAGING_DIR/server.js" ]; then
              echo "ERROR: server.js was not found in standalone release."
              exit 1
            fi

            if [ ! -d "$STAGING_DIR/.next/static" ]; then
              echo "ERROR: .next/static was not found inside standalone release."
              exit 1
            fi

            if [ ! -d "$STAGING_DIR/public" ]; then
              echo "ERROR: public was not found inside standalone release."
              exit 1
            fi

            if [ ! -d "$STAGING_DIR/node_modules" ]; then
              echo "ERROR: standalone node_modules was not found."
              exit 1
            fi

            echo "=== Standalone build validated ==="

            # ---------------------------------------------------------------
            # Stop current application.
            # ---------------------------------------------------------------

            if command -v pm2 >/dev/null 2>&1; then
              pm2 delete personal-finance-app >/dev/null 2>&1 || true
            fi

            # ---------------------------------------------------------------
            # Remove old application build/runtime files.
            # Keep .env!
            # ---------------------------------------------------------------

            echo "=== Installing new standalone release ==="

            # Stop the current application first.
            if command -v pm2 >/dev/null 2>&1; then
              pm2 delete personal-finance-app >/dev/null 2>&1 || true
            fi

            # Remove ONLY old runtime files.
            # .env is intentionally preserved.
            rm -rf "$APP_PATH/.next"
            rm -rf "$APP_PATH/node_modules"
            rm -rf "$APP_PATH/public"
            rm -f "$APP_PATH/server.js"
            rm -f "$APP_PATH/package.json"

            # Copy standalone release into the application root.
            cp -a "$STAGING_DIR/." "$APP_PATH/"

            rm -rf "$STAGING_DIR"

            echo "=== New application structure ==="
            ls -lah "$APP_PATH"
            ls -lah "$APP_PATH/.next"
            ls -lah "$APP_PATH/public"
            rm -rf "$RELEASE_DIR"

            cd "$APP_PATH"

            # ---------------------------------------------------------------
            # Start standalone Next.js server.
            # ---------------------------------------------------------------

            export NODE_ENV=production
            export PORT=3000
            export HOSTNAME=0.0.0.0

            pm2 start "$APP_PATH/server.js" \
              --name personal-finance-app \
              --cwd "$APP_PATH" \
              --node-args="--env-file=$APP_PATH/.env"

            pm2 save

            echo "=== Deployment completed ==="

            echo "=== PM2 status ==="
            pm2 status

            echo "=== Memory after deployment ==="
            free -h

            echo "=== Disk after deployment ==="
            df -h /

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 5m

          script: |
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi

            echo "=== PM2 ==="
            pm2 status

            echo "=== Application health ==="

            for i in {1..30}; do
              if curl -fsS http://localhost:3000/api/ping >/dev/null; then
                echo "Application is healthy."
                exit 0
              fi

              echo "Waiting for application... attempt $i/30"
              sleep 2
            done

            echo "Application did not become healthy."
            echo "=== PM2 logs ==="
            pm2 logs personal-finance-app --lines 100 --nostream || true

            exit 1