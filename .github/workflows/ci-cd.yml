name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client/personal-finance-app

    env:
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      AUTH_URL: ${{ secrets.AUTH_URL }}
      AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
      AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL_POOLED }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      SETU_ENV: ${{ secrets.SETU_ENV }}
      SETU_BASE_URL: ${{ secrets.SETU_BASE_URL }}
      SETU_AUTH_URL: ${{ secrets.SETU_AUTH_URL }}
      SETU_CLIENT_ID: ${{ secrets.SETU_CLIENT_ID }}
      SETU_CLIENT_SECRET: ${{ secrets.SETU_CLIENT_SECRET }}
      SETU_PRODUCT_INSTANCE_ID: ${{ secrets.SETU_PRODUCT_INSTANCE_ID }}
      SETU_CONNECT_REDIRECT_URL: ${{ secrets.SETU_CONNECT_REDIRECT_URL }}
      SETU_WEBHOOK_URL: ${{ secrets.SETU_WEBHOOK_URL }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/personal-finance-app/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js app
        run: npm run build

      # Create one portable production package.
      # This happens on the GitHub runner, NOT on EC2.
      - name: Package standalone release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          rm -rf release
          mkdir -p release

          tar -czf release/personal-finance-app.tar.gz \
            .next/standalone \
            .next/static \
            public

          echo "=== Release size ==="
          du -h release/personal-finance-app.tar.gz

      - name: Upload production artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: personal-finance-app-release
          path: client/personal-finance-app/release/personal-finance-app.tar.gz
          retention-days: 1

  deploy:
    name: Deploy to AWS EC2
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Download production artifact
        uses: actions/download-artifact@v5
        with:
          name: personal-finance-app-release
          path: release

      - name: Show downloaded artifact
        run: |
          ls -lh release
          file release/personal-finance-app.tar.gz

      - name: Prepare release directory on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 5m
          script: |
            set -e
            rm -rf /tmp/pfa-release
            mkdir -p /tmp/pfa-release
            chmod 755 /tmp/pfa-release
            echo "Prepared /tmp/pfa-release"

      - name: Copy release to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 15m
          source: "release/*"
          target: "/tmp/pfa-release"
          strip_components: 1
          overwrite: true

      - name: Verify release arrived on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 5m
          script: |
            set -e

            echo "=== Files received ==="
            find /tmp/pfa-release -maxdepth 3 -type f -print -exec ls -lh {} \;

            if [ ! -f "/tmp/pfa-release/personal-finance-app.tar.gz" ]; then
              echo "ERROR: personal-finance-app.tar.gz was not found."
              exit 1
            fi

            echo "Release artifact found successfully."

      - name: Install release and restart application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 15m

          script: |
            set -e

            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi

            echo "=== Runtime versions ==="
            node -v
            npm -v
            pm2 -v || true

            APP_DIR="${{ secrets.EC2_APP_DIR }}"
            APP_DIR="${APP_DIR:-/project/Personal-Finance-App}"

            APP_PATH="$APP_DIR/client/personal-finance-app"
            RELEASE_DIR="/tmp/pfa-release/release"

            echo "=== Disk before deployment ==="
            df -h /

            echo "=== Memory before deployment ==="
            free -h

            # Make sure application directory exists.
            sudo mkdir -p "$APP_PATH"
            sudo chown "$(whoami)":"$(whoami)" "$APP_PATH"

            # IMPORTANT:
            # Keep the server-side .env file.
            if [ ! -f "$APP_PATH/.env" ]; then
              echo "ERROR: $APP_PATH/.env does not exist."
              echo "Create the production .env file before deploying."
              exit 1
            fi

            # Make sure the artifact arrived.
            if [ ! -f "$RELEASE_DIR/personal-finance-app.tar.gz" ]; then
              echo "ERROR: Release artifact was not uploaded."
              exit 1
            fi

            echo "=== Release artifact ==="
            ls -lh "$RELEASE_DIR/personal-finance-app.tar.gz"

            # Extract into a temporary directory first.
            # This avoids replacing the current deployment with a
            # partially extracted package.
            STAGING_DIR="$APP_PATH/.release-staging"

            rm -rf "$STAGING_DIR"
            mkdir -p "$STAGING_DIR"

            tar -xzf "$RELEASE_DIR/personal-finance-app.tar.gz" \
              -C "$STAGING_DIR"

            # Validate the standalone server before touching the live app.
            if [ ! -f "$STAGING_DIR/.next/standalone/server.js" ]; then
              echo "ERROR: standalone/server.js was not found."
              exit 1
            fi

            if [ ! -d "$STAGING_DIR/.next/static" ]; then
              echo "ERROR: .next/static was not found."
              exit 1
            fi

            echo "=== Standalone build validated ==="

            # Stop/remove the OLD PM2 process.
            # The old process was running `npm start`.
            # The new process will run standalone/server.js directly.
            if command -v pm2 >/dev/null 2>&1; then
              pm2 delete personal-finance-app >/dev/null 2>&1 || true
            fi

            # Remove old build output and old node_modules.
            # node_modules is no longer required on the production server.
            rm -rf "$APP_PATH/.next"
            rm -rf "$APP_PATH/node_modules"
            rm -rf "$APP_PATH/public"

            # Install the already-built production files.
            mv "$STAGING_DIR/.next" "$APP_PATH/.next"
            mv "$STAGING_DIR/public" "$APP_PATH/public"

            rm -rf "$STAGING_DIR"

            # The server still keeps its production .env.
            cd "$APP_PATH"

            echo "=== Starting standalone Next.js server ==="

            export NODE_ENV=production
            export PORT=3000
            export HOSTNAME=0.0.0.0

            if ! command -v pm2 >/dev/null 2>&1; then
              echo "PM2 is not installed."
              echo "Install PM2 once on the EC2 server."
              exit 1
            fi

            # Node 20 supports --env-file.
            # This loads the server-side .env without putting secrets
            # into the GitHub artifact.
            pm2 start .next/standalone/server.js \
              --name personal-finance-app \
              --cwd "$APP_PATH" \
              --node-args="--env-file=$APP_PATH/.env"

            pm2 save

            echo "=== Deployment completed ==="

            echo "=== PM2 status ==="
            pm2 status

            echo "=== Memory after deployment ==="
            free -h

            echo "=== Disk after deployment ==="
            df -h /

            # Clean temporary uploaded artifact.
            rm -rf "$RELEASE_DIR"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 5m

          script: |
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi

            echo "=== PM2 ==="
            pm2 status

            echo "=== Application health ==="

            for i in {1..30}; do
              if curl -fsS http://localhost:3000/api/ping >/dev/null; then
                echo "Application is healthy."
                exit 0
              fi

              echo "Waiting for application... attempt $i/30"
              sleep 2
            done

            echo "Application did not become healthy."
            echo "=== PM2 logs ==="
            pm2 logs personal-finance-app --lines 100 --nostream || true

            exit 1