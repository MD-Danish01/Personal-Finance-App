name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client/personal-finance-app

    env:
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      AUTH_URL: ${{ secrets.AUTH_URL }}
      AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
      AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL_POOLED }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      SETU_ENV: ${{ secrets.SETU_ENV }}
      SETU_BASE_URL: ${{ secrets.SETU_BASE_URL }}
      SETU_AUTH_URL: ${{ secrets.SETU_AUTH_URL }}
      SETU_CLIENT_ID: ${{ secrets.SETU_CLIENT_ID }}
      SETU_CLIENT_SECRET: ${{ secrets.SETU_CLIENT_SECRET }}
      SETU_PRODUCT_INSTANCE_ID: ${{ secrets.SETU_PRODUCT_INSTANCE_ID }}
      SETU_CONNECT_REDIRECT_URL: ${{ secrets.SETU_CONNECT_REDIRECT_URL }}
      SETU_WEBHOOK_URL: ${{ secrets.SETU_WEBHOOK_URL }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/personal-finance-app/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js app
        run: npm run build

  deploy:
    name: Deploy to AWS EC2
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 30m
          script: |
            set -e

            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi

            APP_DIR="${{ secrets.EC2_APP_DIR }}"
            APP_DIR="${APP_DIR:-/project/Personal-Finance-App}"

            # ── Free up disk space deeply before build ───────────────────
            echo "=== Disk usage before cleanup ==="
            df -h / || true

            # 1. Flush PM2 logs to recover disk space from accumulated logs
            if command -v pm2 >/dev/null 2>&1; then
              pm2 flush || true
            fi
            rm -rf "$HOME/.pm2/logs"/* 2>/dev/null || true

            # 2. Clean npm cache, user caches, and temp directories
            npm cache clean --force 2>/dev/null || true
            rm -rf "$HOME/.cache" "$HOME/.npm" /tmp/* /var/tmp/* 2>/dev/null || true

            # 3. Remove Next.js build output and node_modules
            rm -rf "$APP_DIR/client/personal-finance-app/node_modules"
            rm -rf "$APP_DIR/client/personal-finance-app/.next"

            # 4. Remove Docker stopped containers, unused images and build cache if Docker exists
            if command -v docker >/dev/null 2>&1; then
              docker system prune -a --volumes -f 2>/dev/null || true
            fi

            # 5. Clean apt cache, remove old unused kernels and dependencies (frees 1-2 GB)
            sudo apt-get clean 2>/dev/null || true
            sudo apt-get autoremove --purge -y 2>/dev/null || true
            sudo rm -rf /var/cache/apt/archives/*.deb 2>/dev/null || true

            # 6. Clean system logs & old rotated logs
            sudo journalctl --vacuum-time=1d --vacuum-size=20M 2>/dev/null || true
            sudo rm -rf /var/log/*.gz /var/log/*.[0-9] /var/log/*.old /var/log/syslog* 2>/dev/null || true

            # 7. Ensure at least 512MB swap for build stability (OOM protection)
            SWAP_SIZE_MB=$(free -m | awk '/^Swap:/{print $2}')
            if [ "$SWAP_SIZE_MB" -lt 512 ] || [ "$SWAP_SIZE_MB" -gt 1024 ]; then
              echo "Setting swap to 512MB..."
              sudo swapoff /swapfile 2>/dev/null || true
              sudo rm -f /swapfile 2>/dev/null || true
              sudo fallocate -l 512M /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=512 2>/dev/null || true
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile 2>/dev/null || true
              sudo swapon /swapfile 2>/dev/null || true
              grep -q '/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab >/dev/null 2>&1 || true
            fi

            # Fix broken apt state and remove old kernel packages
            sudo apt --fix-broken install -y 2>/dev/null || true
            sudo apt-get autoremove --purge -y 2>/dev/null || true

            # 8. Auto-expand filesystem if EBS volume was resized in AWS Console
            ROOT_DISK=$(df / | tail -1 | awk '{print $1}')
            ROOT_DEV=$(echo "$ROOT_DISK" | sed -E 's/[0-9]+$//; s/p[0-9]+$//')
            PART_NUM=$(echo "$ROOT_DISK" | grep -o '[0-9]*$')
            if [ -n "$ROOT_DEV" ] && [ -n "$PART_NUM" ]; then
              sudo growpart "$ROOT_DEV" "$PART_NUM" 2>/dev/null || true
              sudo resize2fs "$ROOT_DISK" 2>/dev/null || sudo xfs_growfs / 2>/dev/null || true
            fi

            echo "=== Disk usage after cleanup ==="
            df -h / || true
            # ─────────────────────────────────────────────────────────────

            sudo mkdir -p "$APP_DIR"
            sudo chown -R "$(whoami)":"$(whoami)" "$APP_DIR"
            cd "$APP_DIR"

            git config --global --add safe.directory "$APP_DIR" || true

            # Pull latest code. git reset --hard only affects tracked files;
            # untracked files (.env, secrets) are never touched.
            if [ -d .git ]; then
              git remote set-url origin https://github.com/${{ github.repository }}.git 2>/dev/null || true
              git fetch --depth=1 origin main
              git reset --hard origin/main
            else
              git init
              git remote add origin https://github.com/${{ github.repository }}.git 2>/dev/null || git remote set-url origin https://github.com/${{ github.repository }}.git
              git fetch --depth=1 origin main
              git checkout -f -B main origin/main
            fi

            # Shallow-clone keeps only the latest commit
            git gc --prune=now --aggressive 2>/dev/null || true

            cd client/personal-finance-app
            npm ci --include=dev

            # Kill any stray next build processes left over from a crashed previous build
            pkill -9 -f "next build" 2>/dev/null || true
            pkill -9 -f "next-server" 2>/dev/null || true
            sleep 1
            rm -rf .next

            # Allocate memory limit for Node.js build process
            export NODE_OPTIONS="--max-old-space-size=1024"
            npm run build

            if ! command -v pm2 >/dev/null 2>&1; then
              npm install -g pm2
            fi

            if pm2 show personal-finance-app >/dev/null 2>&1; then
              pm2 restart personal-finance-app
            else
              pm2 start npm --name personal-finance-app -- start
            fi

            pm2 save

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 5m
          script: |
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi
            pm2 status || true
            sleep 3
            curl -I http://localhost:3000 || true