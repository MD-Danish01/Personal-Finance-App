name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client/personal-finance-app

    env:
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      AUTH_URL: ${{ secrets.AUTH_URL }}
      AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
      AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL_POOLED }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      SETU_ENV: ${{ secrets.SETU_ENV }}
      SETU_BASE_URL: ${{ secrets.SETU_BASE_URL }}
      SETU_AUTH_URL: ${{ secrets.SETU_AUTH_URL }}
      SETU_CLIENT_ID: ${{ secrets.SETU_CLIENT_ID }}
      SETU_CLIENT_SECRET: ${{ secrets.SETU_CLIENT_SECRET }}
      SETU_PRODUCT_INSTANCE_ID: ${{ secrets.SETU_PRODUCT_INSTANCE_ID }}
      SETU_CONNECT_REDIRECT_URL: ${{ secrets.SETU_CONNECT_REDIRECT_URL }}
      SETU_WEBHOOK_URL: ${{ secrets.SETU_WEBHOOK_URL }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/personal-finance-app/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js app
        run: npm run build

  deploy:
    name: Deploy to AWS EC2
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 30m
          script: |
            set -e

            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi

            APP_DIR="${{ secrets.EC2_APP_DIR }}"
            APP_DIR="${APP_DIR:-/project/Personal-Finance-App}"

            # ── Auto-configure Swap Space if RAM is <= 1.5GB to prevent OOM ─
            TOTAL_RAM_MB=$(free -m | awk '/^Mem:/{print $2}')
            TOTAL_SWAP_MB=$(free -m | awk '/^Swap:/{print $2}')
            if [ "$TOTAL_RAM_MB" -le 1500 ] && [ "$TOTAL_SWAP_MB" -lt 1024 ]; then
              echo "=== Low RAM detected (${TOTAL_RAM_MB}MB). Creating 2GB swap file to prevent OOM crashes ==="
              sudo fallocate -l 2G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048 2>/dev/null || true
              if [ -f /swapfile ]; then
                sudo chmod 600 /swapfile
                sudo mkswap /swapfile 2>/dev/null || true
                sudo swapon /swapfile 2>/dev/null || true
                grep -q '/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab >/dev/null 2>&1 || true
                echo "Swap file active:"
                free -h || true
              fi
            fi

            # ── Free up disk space ────────────────────────────────────────
            echo "=== Disk usage before cleanup ==="
            df -h / || true

            # Remove npm global cache
            npm cache clean --force 2>/dev/null || true

            # Remove only the Next.js build output and node_modules.
            rm -rf "$APP_DIR/client/personal-finance-app/node_modules"
            rm -rf "$APP_DIR/client/personal-finance-app/.next"

            # Remove Docker stopped containers and dangling images if Docker is present
            if command -v docker >/dev/null 2>&1; then
              docker system prune -f 2>/dev/null || true
            fi

            # Remove system package caches
            sudo apt-get clean 2>/dev/null || true
            sudo rm -rf /var/cache/apt/archives/*.deb 2>/dev/null || true
            sudo journalctl --vacuum-size=50M 2>/dev/null || true

            echo "=== Disk usage after cleanup ==="
            df -h / || true
            # ─────────────────────────────────────────────────────────────

            sudo mkdir -p "$APP_DIR"
            sudo chown -R "$(whoami)":"$(whoami)" "$APP_DIR"
            cd "$APP_DIR"

            git config --global --add safe.directory "$APP_DIR" || true

            # Pull latest code. git reset --hard only affects tracked files;
            # untracked files (.env, secrets) are never touched.
            if [ -d .git ]; then
              git remote set-url origin https://github.com/${{ github.repository }}.git 2>/dev/null || true
              git fetch --depth=1 origin main
              git reset --hard origin/main
            else
              git init
              git remote add origin https://github.com/${{ github.repository }}.git 2>/dev/null || git remote set-url origin https://github.com/${{ github.repository }}.git
              git fetch --depth=1 origin main
              git checkout -f -B main origin/main
            fi

            # Shallow-clone keeps only the latest commit
            git gc --prune=now --aggressive 2>/dev/null || true

            cd client/personal-finance-app
            npm ci --include=dev

            # Allocate memory limit for Node.js build process
            export NODE_OPTIONS="--max-old-space-size=1536"
            npm run build

            if ! command -v pm2 >/dev/null 2>&1; then
              npm install -g pm2
            fi

            if pm2 show personal-finance-app >/dev/null 2>&1; then
              pm2 restart personal-finance-app
            else
              pm2 start npm --name personal-finance-app -- start
            fi

            pm2 save

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 5m
          script: |
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi
            pm2 status || true
            sleep 3
            curl -I http://localhost:3000 || true