# iOS Build — GitHub Actions Workflow
#
# Purpose:
#   Validates the Capacitor iOS project compiles correctly on a macOS runner.
#   Produces an unsigned Xcode archive as a downloadable GitHub artifact.
#
# This workflow does NOT install the app on a device directly.
# The final device installation must be done on a Mac using Xcode with your
# free Apple Account (Personal Team).  See iOS_BUILD_GUIDE.md for full steps.
#
# Triggers:
#   - Every push to main (validation)
#   - Manual trigger (workflow_dispatch) for a clean artifact download

name: iOS Build

on:
  push:
    branches: [main]
    paths:
      # Only re-run when iOS-relevant files change
      - "client/personal-finance-app/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "client/personal-finance-app/**"
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: "Upload unsigned archive as artifact"
        required: false
        default: true
        type: boolean

jobs:
  ios-build:
    name: Build iOS (macOS + Xcode)
    runs-on: macos-latest

    defaults:
      run:
        working-directory: client/personal-finance-app

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js setup ───────────────────────────────────────────────────
      # @capacitor/cli@8.x requires Node >=22. Using 22 (current LTS).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/personal-finance-app/package-lock.json

      # ── 3. Install npm dependencies ────────────────────────────────────────
      - name: Install dependencies
        run: npm ci --include=dev

      # ── 4. Next.js build ───────────────────────────────────────────────────
      # The app uses server.url (remote hosted URL) in capacitor.config.ts, so
      # the build output is not strictly required for the iOS native project,
      # but we run it here to catch any TypeScript / compilation errors early.
      - name: Build Next.js app
        run: npm run build
        env:
          # Provide stub values for build-time env checks.
          # These are NOT used at runtime (runtime hits the live server).
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'ci-stub' }}
          AUTH_URL: ${{ secrets.AUTH_URL || 'https://devforge.danishdev.me' }}
          AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID || 'ci-stub' }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET || 'ci-stub' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://ci:ci@localhost/ci' }}
          DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL_POOLED || 'postgresql://ci:ci@localhost/ci' }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://devforge.danishdev.me' }}

      # ── 5. Sync Capacitor iOS ──────────────────────────────────────────────
      # Copies web assets + plugin config into the native Xcode project.
      - name: Sync Capacitor iOS
        run: npx cap sync ios

      # ── 6. Show Xcode version ──────────────────────────────────────────────
      - name: Show Xcode version
        run: xcodebuild -version

      # ── 7. List Xcode schemes ──────────────────────────────────────────────
      # Capacitor 6+ uses Swift Package Manager (SPM), NOT CocoaPods.
      # There is no Podfile / xcworkspace — the project is App.xcodeproj.
      # SPM packages are resolved automatically by xcodebuild.
      - name: List Xcode schemes
        working-directory: client/personal-finance-app/ios/App
        run: xcodebuild -project App.xcodeproj -list

      # ── 8. Resolve Swift Package Manager dependencies ─────────────────────
      # Downloads capacitor-swift-pm and any other SPM packages declared in
      # CapApp-SPM/Package.swift before the archive step.
      - name: Resolve SPM packages
        working-directory: client/personal-finance-app/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -resolvePackageDependencies \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm-packages"

      # ── 9. Build unsigned Xcode archive ───────────────────────────────────
      # CODE_SIGNING_ALLOWED=NO produces a clean compile check without
      # requiring any signing certificate on the runner.
      # Uses -project (not -workspace) because Capacitor 6+ is SPM-based.
      - name: Archive (unsigned — compile validation only)
        working-directory: client/personal-finance-app/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/PersonalFinance.xcarchive" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm-packages" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            archive

      # ── 10. Upload unsigned archive artifact ──────────────────────────────
      # Download this artifact, open on a Mac, and sign with Xcode + your
      # free Personal Team to install on your iPhone.
      - name: Upload unsigned archive
        if: >
          success() &&
          (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: PersonalFinance-iOS-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/PersonalFinance.xcarchive
          retention-days: 14
          if-no-files-found: warn
